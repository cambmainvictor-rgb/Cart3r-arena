<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#101522">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CART3R ARENA">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>CART3R ARENA</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101522;color:#fff;font-family:system-ui,-apple-system,sans-serif;touch-action:none}
#app{height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}
header{display:flex;justify-content:space-between;align-items:center;padding:9px 2px;gap:8px}
h1{font-size:18px;margin:0;letter-spacing:1px}.stats{font-size:12px;color:#cbd5e1;text-align:right;line-height:1.5}
#arena{flex:1;min-height:0;position:relative;border:1px solid #35425a;border-radius:18px;overflow:hidden;background:#172235}
canvas{width:100%;height:100%;display:block}
#controls{height:148px;display:flex;align-items:center;justify-content:space-between;padding:10px 8px;gap:12px}
#pad{width:132px;height:132px;position:relative;flex-shrink:0;border-radius:50%;background:#26344d;border:2px solid #53627a;touch-action:none}
#nub{position:absolute;width:52px;height:52px;border-radius:50%;background:#9aabc4;left:38px;top:38px;box-shadow:0 3px 12px #0008}
#fire{width:108px;height:108px;border-radius:50%;border:3px solid #ffb454;background:#b85c28;color:white;font-size:18px;font-weight:900;touch-action:none}
#fire:active{background:#e07831}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#080d18d9;padding:20px;text-align:center}
.panel{max-width:310px}.panel h2{font-size:28px;margin:0 0 8px}.panel p{color:#d5deeb;font-size:14px;line-height:1.45}
button.main{border:0;border-radius:12px;background:#75d69b;color:#102018;padding:13px 24px;font-size:16px;font-weight:900}
.small{font-size:11px;color:#aebbd0}
@media(min-width:700px){#app{max-width:760px;margin:auto}#controls{height:165px}}
</style>
</head>
<body>
<div id="app">
<header><h1>⚡ CART3R ARENA</h1><div class="stats"><div id="trophy">🏆 0 trophées</div><div id="rank">Rang : Non classé</div><div id="elo">Elo : 0</div></div></header>
<div id="arena"><canvas id="game"></canvas><div id="overlay"><div class="panel"><h2>CART3R ARENA</h2><p>Élimine les bots pour gagner la partie.<br>Victoire : +225 trophées et Elo selon ton rang.<br>Défaite : −2 trophées et −110 Elo.</p><button class="main" id="start">JOUER</button><p class="small">Joystick à gauche · Tir à droite</p></div></div></div>
<div id="controls"><div id="pad"><div id="nub"></div></div><button id="fire">TIRER</button></div>
</div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),overlay=document.getElementById('overlay');
let trophies=+(localStorage.caTrophies||0),elo=+(localStorage.caElo||0),running=false,player,enemies=[],bullets=[],enemyBullets=[],last=0,score=0,move={x:0,y:0},firing=false;
const ranks=[['Bronze',500],['Argent',1000],['Or',1500],['Diamant',5000],['Mythique',6500],['Légendaire',7850],['Master',9000]];
function rank(){if(trophies<5000)return 'Non classé';let r='Bronze';for(const [n,v] of ranks)if(elo>=v)r=n;return r}
function eloWin(){let r=rank();return ({'Bronze':180,'Argent':150,'Or':120,'Diamant':90,'Mythique':70,'Légendaire':70,'Master':70})[r]||180}
function hud(){document.getElementById('trophy').textContent='🏆 '+trophies+' trophées';document.getElementById('rank').textContent='Rang : '+rank()+(trophies<5000?' (débloqué à 5 000)':'');document.getElementById('elo').textContent='Elo : '+elo;localStorage.caTrophies=trophies;localStorage.caElo=elo}
function resize(){const r=canvas.getBoundingClientRect(),d=devicePixelRatio||1;canvas.width=Math.max(1,Math.floor(r.width*d));canvas.height=Math.max(1,Math.floor(r.height*d));ctx.setTransform(d,0,0,d,0,0)}
new ResizeObserver(resize).observe(canvas);resize();hud();
function reset(){let w=canvas.clientWidth,h=canvas.clientHeight;player={x:w/2,y:h/2,r:13,hp:100,cool:0};enemies=[];bullets=[];enemyBullets=[];score=0;for(let i=0;i<3;i++){let a=Math.random()*Math.PI*2;enemies.push({x:40+Math.random()*(w-80),y:35+Math.random()*(h-70),r:13,hp:3,cool:Math.random()*1})}}
function start(){resize();reset();running=true;overlay.style.display='none';last=performance.now();requestAnimationFrame(loop)}
function end(win){running=false;if(win){trophies+=225;elo+=eloWin()}else{trophies=Math.max(0,trophies-2);elo=Math.max(0,elo-110)}hud();overlay.style.display='flex';overlay.innerHTML=`<div class="panel"><h2>${win?'VICTOIRE !':'DÉFAITE'}</h2><p>${win?'+225 trophées · +'+eloWin()+' Elo':'−2 trophées · −110 Elo'}<br>Score : ${score}/3</p><button class="main" id="again">REJOUER</button></div>`;document.getElementById('again').onclick=start}
document.getElementById('start').onclick=start;
function shoot(){if(!running||player.cool>0)return;let target=enemies.sort((a,b)=>Math.hypot(a.x-player.x,a.y-player.y)-Math.hypot(b.x-player.x,b.y-player.y))[0];if(!target)return;let a=Math.atan2(target.y-player.y,target.x-player.x);bullets.push({x:player.x,y:player.y,vx:Math.cos(a)*390,vy:Math.sin(a)*390,r:5});player.cool=.24}
function loop(t){if(!running)return;let dt=Math.min((t-last)/1000,.04);last=t;update(dt);draw();requestAnimationFrame(loop)}
function update(dt){let w=canvas.clientWidth,h=canvas.clientHeight;player.x=Math.max(16,Math.min(w-16,player.x+move.x*220*dt));player.y=Math.max(16,Math.min(h-16,player.y+move.y*220*dt));player.cool=Math.max(0,player.cool-dt);if(firing)shoot();
for(const e of enemies){let a=Math.atan2(player.y-e.y,player.x-e.x),dist=Math.hypot(player.x-e.x,player.y-e.y);if(dist>95){e.x+=Math.cos(a)*55*dt;e.y+=Math.sin(a)*55*dt}e.cool-=dt;if(e.cool<=0&&dist<260){enemyBullets.push({x:e.x,y:e.y,vx:Math.cos(a)*175,vy:Math.sin(a)*175,r:4});e.cool=1.2+Math.random()*.6}}
for(const b of bullets){b.x+=b.vx*dt;b.y+=b.vy*dt;for(const e of enemies)if(e.hp>0&&Math.hypot(b.x-e.x,b.y-e.y)<e.r+b.r){e.hp--;b.dead=true;if(e.hp<=0)score++}}
bullets=bullets.filter(b=>!b.dead&&b.x>-10&&b.y>-10&&b.x<w+10&&b.y<h+10);
for(const b of enemyBullets){b.x+=b.vx*dt;b.y+=b.vy*dt;if(Math.hypot(b.x-player.x,b.y-player.y)<player.r+b.r){player.hp-=18;b.dead=true}}
enemyBullets=enemyBullets.filter(b=>!b.dead&&b.x>-10&&b.y>-10&&b.x<w+10&&b.y<h+10);
if(score>=3)end(true);else if(player.hp<=0)end(false)}
function draw(){let w=canvas.clientWidth,h=canvas.clientHeight;ctx.clearRect(0,0,w,h);ctx.fillStyle='#172235';ctx.fillRect(0,0,w,h);ctx.strokeStyle='#263750';ctx.lineWidth=1;for(let x=20;x<w;x+=32){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}for(let y=20;y<h;y+=32){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}
for(const e of enemies){ctx.fillStyle='#f16b75';ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,7);ctx.fill();ctx.fillStyle='#421c2a';ctx.fillRect(e.x-12,e.y-20,24,4);ctx.fillStyle='#78e09c';ctx.fillRect(e.x-12,e.y-20,24*Math.max(0,e.hp/3),4)}
for(const b of bullets){ctx.fillStyle='#ffd36b';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill()}for(const b of enemyBullets){ctx.fillStyle='#ff8c8c';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill()}
ctx.fillStyle='#69b9ff';ctx.beginPath();ctx.arc(player.x,player.y,player.r,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(player.x-20,player.y-27,40,5);ctx.fillStyle='#66e39a';ctx.fillRect(player.x-20,player.y-27,40*Math.max(0,player.hp/100),5);ctx.fillStyle='#fff';ctx.font='12px system-ui';ctx.fillText('Bots éliminés : '+score+'/3',10,18)}
const pad=document.getElementById('pad'),nub=document.getElementById('nub');let pid=null;
function padMove(e){let r=pad.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,len=Math.hypot(dx,dy),max=42;if(len>max){dx=dx/len*max;dy=dy/len*max}move={x:dx/max,y:dy/max};nub.style.left=(38+dx)+'px';nub.style.top=(38+dy)+'px'}
pad.addEventListener('pointerdown',e=>{pid=e.pointerId;pad.setPointerCapture(pid);padMove(e)});pad.addEventListener('pointermove',e=>{if(e.pointerId===pid)padMove(e)});function release(){pid=null;move={x:0,y:0};nub.style.left='38px';nub.style.top='38px'}pad.addEventListener('pointerup',release);pad.addEventListener('pointercancel',release);
const fire=document.getElementById('fire');fire.addEventListener('pointerdown',e=>{e.preventDefault();firing=true;shoot()});['pointerup','pointercancel','pointerleave'].forEach(ev=>fire.addEventListener(ev,()=>firing=false));
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}
</script>
</body></html>
